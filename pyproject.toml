[project]
name = "google-ads-audit-system"
version = "0.1.0"
description = "CSV-based Google Ads audit, analytics, scoring, dashboard, and report generator."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "plotly>=5.22.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.2.0",
  "streamlit>=1.36.0",
  "openai>=1.35.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py312"
